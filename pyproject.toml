[project]
name = "jolarca-observability"
version = "0.1.0"
description = "Centralized logging, alerting, audit-trail retention and log-integrity for the jolarca-dev marketplace"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "RET", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert (S101) and invoke the verification scripts through
# list-form subprocess with shell=False (S603). Both are safe inside the test
# harness and are ignored here rather than weakening the rules project-wide.
"tests/*" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
